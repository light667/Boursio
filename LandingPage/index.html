        "operatingSystem": "Android, iOS, Web",
        "applicationCategory": "EducationApplication",
        "description": "Application mobile et web munie d'une IA qui recommande des bourses d'études sur-mesure, aide à la candidature et suit les dossiers.",
        "url": "https://boursio.onrender.com",

    <!-- FAQPage (boost SERP avec rich snippets) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Comment Boursio trouve-t-il les bourses adaptées à mon profil ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Boursio utilise une IA qui analyse votre profil académique, votre parcours et vos objectifs pour vous recommander les bourses les plus pertinentes parmi une base de données internationale constamment mise à jour."
            }
          },
          {
            "@type": "Question",
            "name": "Boursio est-il gratuit ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Boursio propose un plan gratuit pour découvrir la plateforme. Des abonnements à 500 FCFA/mois (Essentiel) et 1000 FCFA/mois (Premium) donnent accès aux fonctionnalités avancées de l'IA."
            }
          },
          {
            "@type": "Question",
            "name": "Sur quelles plateformes est disponible Boursio ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Boursio est disponible sur le web (app.boursio.com), sur Android via le Play Store et sur iOS via l'App Store."
            }
          },
          {
            "@type": "Question",
            "name": "Boursio aide-t-il à rédiger les lettres de motivation ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Oui, les agents IA de Boursio analysent votre profil et génèrent des lettres de motivation personnalisées et optimisées pour chaque bourse, que vous pouvez ensuite personnaliser."
            }
          }
        ]
      }
